name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS: single 3.12 leg -- the hosted macOS runner queue has been killing
        # queued jobs at ~15m with zero steps (2026-11-17); fewer macOS legs = fewer
        # queue rolls. 3.10 coverage stays with the ubuntu legs.
        os: [ubuntu-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run test suite
        run: python3 tests/test_edi.py
