<text x="640" y="630" font-size="20" font-weight="bold" fill="#5A6B7B" text-anchor="middle">LOOP (deterministic, one process)</text>
<text x="1090" y="810" font-size="20" font-weight="bold" fill="#5A6B7B" text-anchor="middle">TERMINAL and RECORD</text>
