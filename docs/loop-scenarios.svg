<text x="640.0" y="812" font-size="15" fill="#2A3742" text-anchor="middle">+ held-out &amp; planted controls</text>
<text x="640.0" y="832" font-size="15" fill="#2A3742" text-anchor="middle">scores kept per dimension</text>
