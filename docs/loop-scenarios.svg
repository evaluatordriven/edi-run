<text x="170.0" y="472" font-size="15" fill="#2A3742" text-anchor="middle">nothing written</text>
<rect x="80" y="540" width="280" height="100" rx="10" fill="#EAF2FB" stroke="#3B6EA5" stroke-width="2.5"/>
<text x="220.0" y="568" font-size="19" font-weight="bold" fill="#3B6EA5" text-anchor="middle">CUSTODY LOG OPENS</text>
<text x="220.0" y="592" font-size="15" fill="#2A3742" text-anchor="middle">job-start · artifact-supplied</text>
<text x="220.0" y="612" font-size="15" fill="#2A3742" text-anchor="middle">(seed, pre-freeze)</text>
<text x="220.0" y="632" font-size="15" fill="#2A3742" text-anchor="middle">bar-frozen · work-started</text>
<rect x="80" y="690" width="280" height="60" rx="10" fill="#E4EEF7" stroke="#2C5F8A" stroke-width="2.5"/>
<text x="220.0" y="718" font-size="19" font-weight="bold" fill="#2C5F8A" text-anchor="middle">FROZEN</text>
<text x="220.0" y="742" font-size="15" fill="#2A3742" text-anchor="middle">bar digest pinned</text>
<rect x="480" y="650" width="320" height="120" rx="10" fill="#F3EEFA" stroke="#6B4FA1" stroke-width="2.5"/>
<text x="640.0" y="678" font-size="19" font-weight="bold" fill="#6B4FA1" text-anchor="middle">ROUND r (1..N)</text>
<text x="640.0" y="702" font-size="15" fill="#2A3742" text-anchor="middle">r=1 seed job: copy seed,</text>
<text x="640.0" y="722" font-size="15" fill="#2A3742" text-anchor="middle">log artifact-produced</text>
<text x="640.0" y="742" font-size="15" fill="#2A3742" text-anchor="middle">(author = seed author)</text>
<text x="640.0" y="762" font-size="15" fill="#2A3742" text-anchor="middle">else: Maker (script/model/agent)</text>
<rect x="480" y="830" width="320" height="100" rx="10" fill="#F3EEFA" stroke="#6B4FA1" stroke-width="2.5"/>
<text x="640.0" y="858" font-size="19" font-weight="bold" fill="#6B4FA1" text-anchor="middle">EVALUATOR PANEL</text>
<text x="640.0" y="882" font-size="15" fill="#2A3742" text-anchor="middle">every rubric dimension</text>
<text x="640.0" y="902" font-size="15" fill="#2A3742" text-anchor="middle">+ held-out and planted controls</text>
<text x="640.0" y="922" font-size="15" fill="#2A3742" text-anchor="middle">scores kept per dimension</text>
<rect x="480" y="990" width="320" height="70" rx="10" fill="#FFF7E6" stroke="#B28A2E" stroke-width="2.5"/>
<text x="640.0" y="1018" font-size="19" font-weight="bold" fill="#B28A2E" text-anchor="middle">ALL DIMENSIONS CONFORMED?</text>
<text x="640.0" y="1042" font-size="15" fill="#2A3742" text-anchor="middle">(no averaging, ever)</text>
<rect x="480" y="1120" width="320" height="80" rx="10" fill="#F3EEFA" stroke="#6B4FA1" stroke-width="2.5"/>
<text x="640.0" y="1148" font-size="19" font-weight="bold" fill="#6B4FA1" text-anchor="middle">PARETO COMPARE</text>
<text x="640.0" y="1172" font-size="15" fill="#2A3742" text-anchor="middle">better on >=1 dimension</text>
<text x="640.0" y="1192" font-size="15" fill="#2A3742" text-anchor="middle">AND worse on none -> incumbent</text>
<rect x="920" y="830" width="340" height="130" rx="10" fill="#FBE9E9" stroke="#B33A3A" stroke-width="2.5"/>
<text x="1090.0" y="858" font-size="19" font-weight="bold" fill="#B33A3A" text-anchor="middle">NEEDS_OWNER (exit 2)</text>
<text x="1090.0" y="882" font-size="15" fill="#2A3742" text-anchor="middle">maker_failed · no_artifact</text>
<text x="1090.0" y="902" font-size="15" fill="#2A3742" text-anchor="middle">dormant_channel · cap_reached</text>
<text x="1090.0" y="922" font-size="15" fill="#2A3742" text-anchor="middle">no_observation · runtime_error</text>
<text x="1090.0" y="942" font-size="15" fill="#2A3742" text-anchor="middle">interrupted (Ctrl-C/SIGTERM)</text>
<rect x="920" y="1010" width="340" height="60" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="1090.0" y="1038" font-size="19" font-weight="bold" fill="#2E7D32" text-anchor="middle">ACCEPTED (exit 0)</text>
<text x="1090.0" y="1062" font-size="15" fill="#2A3742" text-anchor="middle">loop ends</text>
<rect x="920" y="1140" width="340" height="90" rx="10" fill="#E4EEF7" stroke="#2C5F8A" stroke-width="2.5"/>
<text x="1090.0" y="1168" font-size="19" font-weight="bold" fill="#2C5F8A" text-anchor="middle">FINALIZE (once only)</text>
<text x="1090.0" y="1192" font-size="15" fill="#2A3742" text-anchor="middle">integrity gate: verify chain,</text>
<text x="1090.0" y="1212" font-size="15" fill="#2A3742" text-anchor="middle">refuse double disposition</text>
<rect x="920" y="1320" width="280" height="70" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="1060.0" y="1348" font-size="19" font-weight="bold" fill="#2E7D32" text-anchor="middle">record.json (exit 0)</text>
<text x="1060.0" y="1372" font-size="15" fill="#2A3742" text-anchor="middle">disposition given / declined</text>
<rect x="920" y="1460" width="340" height="80" rx="10" fill="#FDF3E0" stroke="#B26A1B" stroke-width="2.5"/>
<text x="1090.0" y="1488" font-size="19" font-weight="bold" fill="#B26A1B" text-anchor="middle">GAP RECORD (exit 1)</text>
<text x="1090.0" y="1512" font-size="15" fill="#2A3742" text-anchor="middle">x-edi-run.gaps[] names</text>
<text x="1090.0" y="1532" font-size="15" fill="#2A3742" text-anchor="middle">exactly what never happened</text>
