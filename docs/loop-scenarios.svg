<text x="220.0" y="278" font-size="19" font-weight="bold" fill="#3B6EA5" text-anchor="middle">GATES (freeze)</text>
<text x="220.0" y="302" font-size="15" fill="#2A3742" text-anchor="middle">bounds · seats · instruments</text>
<text x="220.0" y="322" font-size="15" fill="#2A3742" text-anchor="middle">pricing (model seats)</text>
<text x="220.0" y="342" font-size="15" fill="#2A3742" text-anchor="middle">seed files + author seats</text>
<text x="220.0" y="362" font-size="15" fill="#2A3742" text-anchor="middle">approvals vs bar digest</text>
