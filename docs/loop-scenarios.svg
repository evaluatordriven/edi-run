<text x="640.0" y="652" font-size="15" fill="#2A3742" text-anchor="middle">(author = seed author)</text>
<text x="640.0" y="672" font-size="15" fill="#2A3742" text-anchor="middle">else: Maker call (script/model/agent)</text>
