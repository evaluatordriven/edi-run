<text x="1240" y="1424" font-size="15" fill="#33414E" text-anchor="middle">incomplete run</text>
<circle cx="430" cy="1400" r="16" fill="#1A2733" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="430" y="1406" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">18</text>
